<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umair Zahoor Karel — Data Engineer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #080c14;
      --bg2:    #0d1424;
      --bg3:    #111827;
      --cyan:   #00d4ff;
      --purple: #7c3aed;
      --green:  #10b981;
      --text:   #e2e8f0;
      --muted:  #94a3b8;
      --border: rgba(0,212,255,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1rem 2.5rem;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(20px);
      background: rgba(8,12,20,0.85);
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s;
    }
    .nav-logo { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--cyan); text-decoration: none; }
    .nav-logo span { color: var(--muted); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--muted); text-decoration: none; font-size: 0.875rem;
      font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
      height: 2px; background: var(--cyan); transform: scaleX(0); transition: transform 0.2s;
    }
    .nav-links a:hover { color: var(--cyan); }
    .nav-links a:hover::after { transform: scaleX(1); }

    /* ── HERO ── */
    #hero {
      position: relative; height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .floating-kw {
      position: absolute;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: rgba(0,212,255,0.32); pointer-events: none;
      animation: floatUp var(--dur, 9s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0); }
      15%  { opacity: 1; }
      85%  { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(-120px); }
    }

    .hero-content {
      position: relative; z-index: 2;
      text-align: center; max-width: 860px; padding: 0 2rem;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 1rem; border: 1px solid var(--border); border-radius: 100px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      color: var(--cyan); background: rgba(0,212,255,0.04);
      margin-bottom: 1.5rem; animation: fadeDown 0.7s ease both;
    }
    .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.6)} }
    .hero-name {
      font-size: clamp(2.4rem, 5.5vw, 4.8rem); font-weight: 700; line-height: 1.1; margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, var(--cyan) 55%, var(--purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: fadeUp 0.7s ease 0.15s both;
    }
    .hero-title {
      font-family: 'JetBrains Mono', monospace; font-size: clamp(1rem, 2.2vw, 1.4rem);
      color: var(--cyan); margin-bottom: 1.5rem; min-height: 2.2em;
      animation: fadeUp 0.7s ease 0.3s both;
    }
    .cursor {
      display: inline-block; width: 2px; height: 1.1em;
      background: var(--cyan); margin-left: 2px; vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .hero-desc {
      font-size: 1.05rem; color: var(--muted); max-width: 600px;
      margin: 0 auto 2.5rem; line-height: 1.75;
      animation: fadeUp 0.7s ease 0.45s both;
    }
    .hero-buttons {
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
      animation: fadeUp 0.7s ease 0.6s both;
    }
    .btn-primary {
      padding: 0.72rem 2rem; background: var(--cyan); color: var(--bg);
      border: none; border-radius: 8px; font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem; font-weight: 600; text-decoration: none; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 0 24px rgba(0,212,255,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(0,212,255,0.5); }
    .btn-ghost {
      padding: 0.72rem 2rem; background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.92rem; font-weight: 500;
      text-decoration: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }

    .scroll-hint {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      color: var(--muted); font-size: 0.7rem; letter-spacing: 0.12em;
      animation: fadeUp 1s ease 1.4s both;
    }
    .scroll-mouse { width: 20px; height: 32px; border: 2px solid rgba(148,163,184,0.4); border-radius: 10px; position: relative; }
    .scroll-mouse::after {
      content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
      width: 3px; height: 7px; background: var(--cyan); border-radius: 2px;
      animation: scrollWheel 1.6s infinite;
    }
    @keyframes scrollWheel { 0%{top:5px;opacity:1} 100%{top:18px;opacity:0} }

    /* ── LAYOUT ── */
    .section-wrap { padding: 6rem 2rem; max-width: 1100px; margin: 0 auto; }
    .section-full { padding: 6rem 0; }
    .section-full .inner { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

    .label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--cyan); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.6rem; }
    .label::before { content: '// '; color: var(--purple); }
    .section-h { font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 700; margin-bottom: 0.75rem; }
    .section-h span { color: var(--cyan); }
    .divider { width: 56px; height: 3px; border-radius: 2px; margin-bottom: 3rem; background: linear-gradient(90deg, var(--cyan), var(--purple)); }

    /* ── ABOUT ── */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    .about-text p { color: var(--muted); line-height: 1.8; margin-bottom: 1.25rem; font-size: 0.975rem; }
    .about-text strong { color: var(--cyan); font-weight: 600; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .stat-card {
      padding: 1.5rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      text-align: center; transition: all 0.3s; position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.06), transparent 60%);
      opacity: 0; transition: opacity 0.3s;
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-card:hover { border-color: rgba(0,212,255,0.35); transform: translateY(-3px); }
    .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--cyan); display: block; }
    .stat-lbl { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    /* ── SKILLS ── */
    #skills { background: linear-gradient(180deg, transparent, rgba(0,212,255,0.018), transparent); }
    .skills-wrap { display: flex; flex-direction: column; gap: 2.25rem; }
    .skill-cat h3 {
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      color: var(--purple); letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.75rem;
    }
    .skill-cat h3::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 0.65rem; }
    .tag {
      padding: 0.35rem 0.9rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.825rem; color: var(--muted); font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s; cursor: default; opacity: 0; transform: translateY(8px);
    }
    .tag.in { animation: tagIn 0.35s ease forwards; }
    @keyframes tagIn { to { opacity:1; transform:translateY(0); } }
    .tag.hi { border-color: rgba(0,212,255,0.28); color: var(--cyan); background: rgba(0,212,255,0.04); }
    .tag:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0,212,255,0.07); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,212,255,0.12); }

    /* ── EXPERIENCE ── */
    .timeline { position: relative; padding-left: 1.75rem; }
    .timeline::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: linear-gradient(to bottom, var(--cyan) 0%, var(--purple) 60%, transparent 100%);
    }
    #pipe-dot {
      position: absolute; left: -4px; width: 10px; height: 10px;
      background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan);
      animation: pipeDot 4s linear infinite;
    }
    @keyframes pipeDot { 0%{top:0%;opacity:0} 5%{opacity:1} 95%{opacity:1} 100%{top:100%;opacity:0} }
    .job {
      position: relative; margin-bottom: 2.5rem; padding-left: 1.75rem;
      opacity: 0; transform: translateX(-16px); transition: all 0.5s ease;
    }
    .job.in { opacity: 1; transform: translateX(0); }
    .job::before {
      content: ''; position: absolute; left: -6px; top: 9px;
      width: 12px; height: 12px; background: var(--bg); border: 2px solid var(--cyan); border-radius: 50%; z-index: 1;
    }
    .job-co { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.3rem; }
    .job-meta { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .job-role { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--cyan); }
    .job-period { font-size: 0.76rem; color: var(--muted); background: var(--bg2); border: 1px solid var(--border); padding: 0.18rem 0.7rem; border-radius: 100px; }
    .job-body { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: border-color 0.3s; }
    .job-body:hover { border-color: rgba(0,212,255,0.25); }
    .proj-block { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--border); }
    .proj-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .proj-name { font-weight: 600; font-size: 0.92rem; color: var(--text); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .proj-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--purple); background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); padding: 0.12rem 0.45rem; border-radius: 4px; }
    .bullets { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
    .bullets li { font-size: 0.86rem; color: var(--muted); line-height: 1.65; padding-left: 1.2rem; position: relative; }
    .bullets li::before { content: '▸'; position: absolute; left: 0; color: var(--cyan); }
    .bullets li b { color: var(--text); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.65rem; }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--cyan); background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.18); padding: 0.12rem 0.5rem; border-radius: 4px; }

    /* ── PROJECTS ── */
    .proj-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 2rem; transition: all 0.3s; position: relative; overflow: hidden;
      opacity: 0; transform: translateY(20px);
    }
    .proj-card.in { animation: riseIn 0.5s ease forwards; }
    @keyframes riseIn { to { opacity:1; transform:translateY(0); } }
    .proj-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      transform: scaleX(0); transform-origin: left; transition: transform 0.4s;
    }
    .proj-card:hover::before { transform: scaleX(1); }
    .proj-card:hover { border-color: rgba(0,212,255,0.28); transform: translateY(-4px); }
    .proj-card-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .proj-card-title a { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--cyan); text-decoration: none; opacity: 0.65; display: flex; align-items: center; gap: 0.3rem; transition: opacity 0.2s; }
    .proj-card-title a:hover { opacity: 1; }
    .proj-card-title a svg { width: 15px; height: 15px; fill: currentColor; }
    .proj-card-tech { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--purple); margin-bottom: 1rem; }

    /* ── ACHIEVEMENTS ── */
    .ach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
    .ach-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; display: flex; gap: 1rem; align-items: flex-start;
      transition: all 0.3s; opacity: 0; transform: translateY(18px);
    }
    .ach-card.in { animation: riseIn 0.5s ease forwards; }
    .ach-card:hover { border-color: rgba(0,212,255,0.28); transform: translateY(-3px); }
    .ach-icon { width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .ach-icon.sf  { background: rgba(41,182,246,0.1);  border: 1px solid rgba(41,182,246,0.25); }
    .ach-icon.aw  { background: rgba(251,191,36,0.1);  border: 1px solid rgba(251,191,36,0.25); }
    .ach-icon.aws { background: rgba(255,153,0,0.1);   border: 1px solid rgba(255,153,0,0.25); }
    .ach-card h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
    .ach-card p  { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
    .ach-link { margin-top: 0.5rem; display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--cyan); text-decoration: none; opacity: 0.65; transition: opacity 0.2s; }
    .ach-link:hover { opacity: 1; }

    /* ── EDUCATION ── */
    .edu-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; display: flex; gap: 1.5rem; align-items: flex-start; transition: border-color 0.3s; }
    .edu-card:hover { border-color: rgba(0,212,255,0.28); }
    .edu-icon { width: 54px; height: 54px; flex-shrink: 0; border-radius: 12px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; }
    .edu-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.2rem; }
    .edu-deg  { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--cyan); margin-bottom: 0.2rem; }
    .edu-per  { font-size: 0.8rem; color: var(--muted); }
    .edu-gpa  { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.7rem; padding: 0.25rem 0.7rem; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--green); }

    /* ── CONTACT ── */
    .contact-desc { color: var(--muted); font-size: 1rem; max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.7; text-align: center; }
    .contact-links { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }
    .c-link { display: flex; align-items: center; gap: 0.55rem; padding: 0.7rem 1.4rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 0.875rem; transition: all 0.2s; }
    .c-link:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,212,255,0.12); }
    .c-link svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    /* ── FOOTER ── */
    footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; }
    footer span { color: var(--cyan); }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }
    .reveal { opacity:0; transform:translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.in { opacity:1; transform:translateY(0); }

    /* ── PIPELINE DIVIDERS ── */
    .pipe-divider { padding: 0.25rem 2rem 1.75rem; overflow: hidden; }
    .pipe-inner { max-width: 1100px; margin: 0 auto; position: relative; height: 68px; }
    .pipe-rail {
      position: absolute; top: 20px; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2) 8%, rgba(0,212,255,0.45) 40%, rgba(124,58,237,0.45) 75%, transparent);
      transform: scaleX(0); transform-origin: left;
      transition: transform 1.1s cubic-bezier(0.4,0,0.2,1);
    }
    .pipe-divider.in .pipe-rail { transform: scaleX(1); }
    .pipe-nodes { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; }
    .pn {
      position: absolute; top: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transform: translateX(-50%) translateY(10px); opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .pipe-divider.in .pn { opacity: 1; transform: translateX(-50%) translateY(0); }
    .pn-dot {
      width: 10px; height: 10px; border: 2px solid var(--cyan);
      border-radius: 50%; background: var(--bg);
    }
    .pipe-divider.in .pn-dot { animation: pnPulse 2.5s ease infinite; }
    @keyframes pnPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.5); }
      50%     { box-shadow: 0 0 0 5px rgba(0,212,255,0); }
    }
    .pn-lbl {
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    }
    .pipe-caption {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: rgba(124,58,237,0.5); letter-spacing: 0.15em; white-space: nowrap;
    }
    .pipe-pkt {
      position: absolute; top: 15px; left: 0;
      width: 7px; height: 7px; border-radius: 50%; opacity: 0;
      background: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 18px rgba(0,212,255,0.4);
    }
    .pipe-divider.in .pipe-pkt { animation: pktFlow 2.2s ease 0.9s infinite; }
    @keyframes pktFlow {
      0%  { left: 0; opacity: 0; }
      4%  { opacity: 1; }
      96% { opacity: 1; }
      100%{ left: calc(100% - 7px); opacity: 0; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      nav { padding: 0.85rem 1.25rem; }

      .section-wrap { padding: 3.5rem 1.25rem; }
      .section-full { padding: 3.5rem 0; }
      .section-full .inner { padding: 0 1.25rem; }
      .divider { margin-bottom: 2rem; }

      .hero-content { padding: 0 1.25rem; }
      .hero-badge { font-size: 0.68rem; padding: 0.28rem 0.8rem; margin-bottom: 1rem; }
      .hero-name { margin-bottom: 0.65rem; }
      .hero-title { margin-bottom: 1rem; }
      .hero-desc { font-size: 0.92rem; margin-bottom: 1.75rem; }
      #hero { height: auto; min-height: 100vh; flex-direction: column; justify-content: center; padding: 5rem 0 2.5rem; }
      .hero-buttons { flex-direction: column; align-items: center; gap: 0.65rem; }
      .hero-buttons a { width: 100%; max-width: 260px; text-align: center; }
      .scroll-hint { position: relative; bottom: auto; left: auto; transform: none; margin-top: 1.75rem; }
      .floating-kw:nth-child(n+7) { display: none; }

      .about-grid { grid-template-columns: 1fr; gap: 2rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .stat-num { font-size: 2rem; }

      .skills-wrap { gap: 1.75rem; }
      .tag { font-size: 0.78rem; }
